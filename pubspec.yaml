# pubspec.yaml fixes applied per MelaFilm integration prompt:
# - firebase_auth ^5.1.0 → ^6.6.1 (was conflicting with firebase_core ^3.x APIs)
# - build_runner ^2.4.0 → ^2.16.1 (aligned with current Dart SDK)
# - dio + archive promoted to direct dependencies (were transitive only)
name: feb
description: A media streaming and downloading application.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter


  screen_brightness: ^2.0.0
  flutter_volume_controller: ^1.2.0
  http: ^1.2.0
  html: ^0.15.4
  crypto: ^3.0.3
  cached_network_image: ^3.3.1
  webview_flutter: ^4.7.0
  url_launcher: ^6.2.5
  flutter_inappwebview: ^6.1.5
  wakelock_plus: ^1.1.4
  cupertino_icons: ^1.0.8
  youtube_player_flutter: ^9.1.0
  flutter_local_notifications: ^22.3.0
  # Fetched over http; file_picker is a dead dep — remove when updating
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  # Added for local storage persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.6
  pointycastle: ^3.9.1
  speech_to_text: ^7.3.0
  ota_update: ^7.1.0
  flutter_launcher_icons: ^0.14.4
  # flutter_eval removed: pulled transitive jni (libdartjni.so) + jni_flutter
  # into the APK but was never imported anywhere in lib/.
  gal: ^2.3.0
  permission_handler: ^11.3.1
  file_saver: ^0.2.2
  flutter_file_dialog: ^3.0.3
  video_player: ^2.9.2

  # --- NEW ADDED PACKAGES ---
  google_sign_in: ^6.1.5
  firebase_core: ^4.14.0 # FIXED: firebase_auth 6.x needs firebase_core 4.x (was 3.1.0)
  firebase_auth: ^6.6.1 # FIXED: was 5.1.0
  sign_in_with_apple: ^6.1.0
  package_info_plus: ^8.1.0
  open_filex: ^4.7.0
  # youtube_player_iframe removed: zero imports (only youtube_player_flutter used)
  # SIZE FIX: was ffmpeg_kit_flutter_new (Full-GPL: ~43 MB/ABI). The app only
  # does remux (stream copy), ffprobe verification and a last-resort libx264
  # re-encode — min-gpl covers all three at a fraction of the size.
  # Same Dart API, drop-in import swap. Requires minSdk >= 24 (see build.gradle.kts).
  ffmpeg_kit_flutter_new_min_gpl: ^2.6.0
  auto_orientation: ^2.3.1
  # Real network-type detection for the player's connectivity-aware quality
  # capping (was referenced in cellular_data_service.dart comments but never
  # actually added as a dependency, so that detection was a no-op).
  connectivity_plus: ^6.1.3
  # flutter_background_service removed: only mentioned in TODO comments, never
  # imported. Re-add when the background-download foreground service lands.
  # NEW: Torrentio + OpenSubtitles dependencies
  dio: ^5.4.0
  archive: ^3.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Added for generating Hive adapters
  hive_generator: ^2.0.1
  build_runner: ^2.4.0 # kept: hive_generator 2.0.1 needs analyzer <7.0.0 (2.15+ breaks)

  # Mock Firebase platform channels in widget/unit tests
  firebase_core_platform_interface: ^8.1.1 # FIXED: firebase_auth 6.x needs ^8.x (was 6.0.3)

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  fonts:
    - family: AstoneNouvea
      fonts:
        - asset: assets/fonts/Astone Nouvea.ttf
          weight: 400
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
        - asset: assets/fonts/RobotoMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/RobotoMono-Bold.ttf
          weight: 700

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - assets/fab.jpg
    - shorebird.yaml

# --- CORRECTLY PLACED AT THE ROOT LEVEL ---
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/logo.png"
  min_sdk_android: 21
