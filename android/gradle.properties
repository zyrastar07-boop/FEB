# Lowered from -Xmx4G/-XX:MaxMetaspaceSize=4G: on machines with 5GB RAM the
# Gradle daemon was exhausting native memory and crashing (hs_err OOM during
# assembleRelease). Keep the daemon within ~3.5GB so builds survive.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Cap parallel workers so a low-RAM machine doesn't spawn too many daemons/threads.
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
android.r8.proguardAndroidTxt.disallowed=false